# Off-box watchdog: the site and the trusted fetcher can both die quietly. This notices.
name: watchdog
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: github.repository == 'gitemon-fun/gitemon'
    runs-on: ubuntu-latest
    steps:
      - name: check health and fetcher backlog
        env:
          TG_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          set -u
          body=$(curl -fsS --max-time 20 https://gitemon.fun/health) || body=''
          problem=''
          if [ -z "$body" ]; then problem='gitemon.fun /health is down';
          else
            age=$(echo "$body" | jq -r '.pendingOldestMin // 0')
            if [ "$age" -gt 30 ]; then problem="fetcher backlog: oldest request waiting ${age} min (is the fetcher timer running?)"; fi
          fi
          if [ -n "$problem" ]; then
            curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" -d text="Gitemon watchdog: ${problem}" >/dev/null
            exit 1
          fi
