# Account id comes from CLOUDFLARE_ACCOUNT_ID at deploy time; resource ids below are not secrets.
name = "gitemon"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [
  { pattern = "gitemon.fun", custom_domain = true },
  { pattern = "www.gitemon.fun", custom_domain = true },
]

[alias]
"@gitemon/art" = "../../packages/creature-gen/src/art-entry.ts"

[assets]
directory = "../web/dist"
binding = "STATIC"
run_worker_first = true

[vars]
PUBLIC_ORIGIN = "https://gitemon.fun"
WORKOS_CLIENT_ID = "__set_as_secret__"

[[d1_databases]]
binding = "DB"
database_name = "gitemon"
database_id = "__D1_ID__"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gitemon-assets"

[observability]
enabled = true
